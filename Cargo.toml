[package]
name = "prekk"
version = "0.1.0"
edition = "2021"
description = "Stream Axona tetrode recordings into KlustaKwik features"
publish = false

[features]
default = []
lapack = ["dep:blas", "dep:lapack"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
blas = { version = "0.23.0", optional = true }
lapack = { version = "0.20.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
