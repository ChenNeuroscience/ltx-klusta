[package]
name = "ltx-klusta"
version = "0.1.0"
edition = "2021"
description = "PCA feature extraction and KlustaKwik-derived spike clustering for tetrode recordings"
publish = false
default-run = "ltxk"

[[bin]]
name = "ltxk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
