[package]
name = "fancykk"
version = "0.1.0"
edition = "2021"
description = "Feature extraction and classic KlustaKwik clustering for Axona tetrode recordings"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
