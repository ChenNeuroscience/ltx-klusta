name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            package_platform: windows
            executable: target/release/ltxk.exe
          - os: macos-15
            platform: macos-arm64
            package_platform: macos
            executable: target/release/ltxk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up stable Rust and check tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format, lint, and release unit tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        run: python scripts/package_rust.py --exe ${{ matrix.executable }} --output dist/ltxk-${{ matrix.platform }} --platform ${{ matrix.package_platform }}
      - name: Test the package (CLI, dumps, features, clustering, queue, console, 1M spikes)
        run: python tests/check_package.py --package dist/ltxk-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ltxk-${{ matrix.platform }}
          path: dist/ltxk-${{ matrix.platform }}.zip*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ltxk-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ltxk-*
          path: release
          merge-multiple: true
      - name: Select commit tag
        id: package
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          test "$(ls release/*.zip | wc -l)" -eq 2
      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.package.outputs.tag }}
          commit: ${{ github.sha }}
          name: ltxk ${{ steps.package.outputs.tag }}
          body: Built and tested from commit ${{ github.sha }}. Windows - download the windows zip, extract it, and drag recordings onto ltxk.exe. macOS - download the macos zip and move ltx-klusta.app to Applications. See README.md for details.
          artifacts: release/*.zip,release/*.sha256
          artifactErrorsFailBuild: true
          allowUpdates: true
          makeLatest: true
